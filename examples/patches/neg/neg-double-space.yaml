# NEGATIVE demo — double space = empty token. Aborts with:
#   "empty token in pattern". Spaces are separators; use `_` for literal space.
# Safe to run for real: compilation fails before anything is written.
meta:
  version: "0.0.4"
  name: "neg-double-space"

files:
  - op: replace
    path: examples/work/app.conf
    match: "^ cache_size  _ = _ {:d:}"
    replace: "x"
