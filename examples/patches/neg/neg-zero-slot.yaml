# NEGATIVE demo — zero slots. Aborts with:
#   "pattern must contain exactly one {: :} slot, found 0".
# Safe to run for real: compilation fails before anything is written.
meta:
  version: "0.0.1"
  name: "neg-zero-slot"

files:
  - op: replace
    path: examples/work/app.conf
    match: "^ cache_size _ = _ 512"
    replace: "x"
