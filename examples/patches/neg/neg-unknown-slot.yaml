# NEGATIVE demo — unknown slot body. Aborts with:
#   "unknown slot body: '{:w:}'". Only {::} {:*:} {:d:} {:s:} exist.
# Safe to run for real: compilation fails before anything is written.
meta:
  version: "0.0.3"
  name: "neg-unknown-slot"

files:
  - op: replace
    path: examples/work/app.conf
    match: "^ cache_size _ = _ {:w:}"
    replace: "x"
