# 02 — spacing: optional space, whitespace slot, one-or-more slot, append.
# Run from repo root:  bin/n0ct-patch examples/patches/02-spacing.yaml [--dry-run]
meta:
  version: "0.2.0"
  name: "spacing"
  summary: "Optional space, whitespace slot, one-or-more slot, guarded append"

files:
  # `_?` matches zero or more spaces: `debug=true` AND `debug = true` both hit.
  - op: replace
    path: examples/work/spacing.conf
    match: "^ debug _? = _? {:*:}"
    replace: "true"

  # `{:s:}` matches whitespace only — just the gap is replaced.
  # Guarded: after the first run no `pad +OUT` line is left, so re-runs skip.
  - op: replace
    path: examples/work/spacing.conf
    match: "^ pad {:s:} OUT"
    replace: "->"
    when: "grep -qE 'pad +OUT' examples/work/spacing.conf"

  # `{::}` needs 1+ chars: `name = x` updates, bare `name = ` is left alone.
  # No abort — abort only happens when ZERO lines match in the whole file.
  - op: replace
    path: examples/work/spacing.conf
    match: "^ name _ = _ {::}"
    replace: "filled"

  # Target lacks a trailing newline: newline_before (default true) inserts one.
  # Guarded so re-runs don't duplicate the block.
  - op: append
    path: examples/work/no-trailing-nl.conf
    content: |
      [appended]
      marker = yes
    when: "! grep -qF '[appended]' examples/work/no-trailing-nl.conf"
