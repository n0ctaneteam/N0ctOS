# 05+06 — package merge demo (the a/b/c/d/e saga).
# Batch dry-run prints ONE merged pass: remove [a c], add [b d e]
# (last-op-wins per package across both files). A real batch run calls
# paru exactly twice for the whole batch — never install-then-remove.
# Run from repo root:
#   bin/n0ct-patch --apply-missing --patches-dir examples/patches \
#     --applied-file /tmp/demo-applied.txt --dry-run
meta:
  version: "0.5.0"
  name: "pkgs-a"

packages:
  add: [a, b, c]
  remove: [d, e]

pre:
  - id: note-a
    run: printf 'note-a\n' >> examples/work/markers.log
    when: "! grep -qx 'note-a' examples/work/markers.log"

files:
  - op: create
    path: examples/work/marker-a.txt
    overwrite: true
    content: "a\n"
