# 01 — basics: literal escaping, variable space, digit slot, every-line update.
# Run from repo root:  bin/n0ct-patch examples/patches/01-basics.yaml [--dry-run]
meta:
  version: "0.1.0"
  name: "basics"
  summary: "Literal-dot escaping, variable space, digit slot, multi-line update"

pre:
  - id: backup-app
    run: cp examples/work/app.conf examples/work/app.conf.bak
    when: "test -f examples/work/app.conf"

files:
  # Literal text is regex-escaped: `hl.gapsin` does NOT match `hlXgapsin`.
  # `_?` tolerates `=`, `=`, `     =     ` alike. EVERY matching line updates.
  - op: replace
    path: examples/work/theme.conf
    match: "^ hl.gapsin _? = _? {:d:}"
    replace: "6"

  # `{:*:}` slot: only the value changes, surrounding whitespace stays verbatim.
  - op: replace
    path: examples/work/app.conf
    match: "^ hl.gapsin _ = _ {:*:}"
    replace: "6"

  # Digits-only slot.
  - op: replace
    path: examples/work/app.conf
    match: "^ cache_size _ = _ {:d:}"
    replace: "512"

post:
  - id: verify-gaps
    run: grep -q '^hl.gapsin = 6$' examples/work/theme.conf
