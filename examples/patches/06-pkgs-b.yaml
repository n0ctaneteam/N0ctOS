# 06 — second half of the merge demo. Last mention wins: d/e flip back
# to add, a/c flip to remove. See 05-pkgs-a.yaml header for how to run.
meta:
  version: "0.6.0"
  name: "pkgs-b"

packages:
  add: [e, d]
  remove: [a, c]

pre:
  - id: note-b
    run: printf 'note-b\n' >> examples/work/markers.log
    when: "! grep -qx 'note-b' examples/work/markers.log"

files:
  - op: create
    path: examples/work/marker-b.txt
    overwrite: true
    content: "b\n"
